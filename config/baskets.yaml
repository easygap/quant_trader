# =============================================================
# 바스켓 포트폴리오 & 리밸런싱 설정
# =============================================================
# fintics의 Basket/Rebalance 개념을 차용:
#   - 바스켓 = 종목 + 목표 비중의 묶음
#   - 리밸런싱 = 실제 비중 vs 목표 비중 드리프트 감지 → 주문 생성
#
# 여러 바스켓을 정의할 수 있으며, enabled: true인 바스켓만 실행됩니다.
# --mode rebalance 또는 스케줄러 장전 단계에서 실행됩니다.
# =============================================================

baskets:

  # --- 예시 1: 한국 대형주 균등 배분 바스켓 ---
  kr_blue_chip:
    name: "한국 대형주 균등배분"
    enabled: false
    rebalance:
      trigger: drift               # drift(비중 이탈) | weekly | monthly
      drift_threshold: 0.05        # 실제-목표 비중 차이가 5%p 이상이면 리밸런싱
      min_trade_amount: 100000     # 리밸런싱 1건 최소 거래금액 (너무 작은 주문 방지)
      max_turnover_ratio: 0.30     # 1회 리밸런싱 시 총자산 대비 최대 매매 비율 (30%)
    holdings:
      "005930": 0.25    # 삼성전자  25%
      "000660": 0.20    # SK하이닉스 20%
      "035420": 0.15    # NAVER    15%
      "005380": 0.15    # 현대차    15%
      "051910": 0.15    # LG화학   15%
      "006400": 0.10    # 삼성SDI  10%
      # 합계 = 1.00 (현금 비중 = diversification.min_cash_ratio로 별도 관리)

  # --- 분산 대형주 buy&hold (수익성 검증 결론 반영) ---
  # docs/PROFITABILITY_FINDINGS.md 결론: 대형주에서 능동 alpha는 없고, 분산 보유(베타)가
  # 현실적 고수익 경로다(실행 기준 ~22% CAGR, Sharpe ~1.0, MDD ~-20%). 능동 리밸런싱은
  # 비용이라 수익을 깎으므로 회전을 최소화한다 — 그래서 분기(quarterly) + 넓은 드리프트
  # 임계값(8%p) + 낮은 회전 상한으로 "사서 들고 있기"에 가깝게 운용한다.
  # 2026-06-10 paper 운영 개시: trading.mode=paper에서 트랙레코드(60영업일) 축적 목적.
  # paper에서는 실주문이 없고, live 전환은 별도로 ENABLE_LIVE_TRADING + --confirm-live +
  # 바스켓별 readiness gate(basket_rebalance:kr_diversified_hold)를 모두 통과해야 한다.
  # 2026-08-07 튜닝: 운영 2개월 실측을 반영해 두 가지를 명시로 바꿨다.
  #   (1) target_stock_weight 0.60 — 종전에는 '주식 80%(=1-min_cash_ratio)'가 설계였는데
  #       실효 배치율은 59%였다(하이닉스 슬롯 미충족 + 정수주 절사 + 추가매수 영구 거부
  #       버그). 그 결과 6/10~8/07 KOSPI -18.6% 구간에서 총자산은 -5.0%로 막혔다 —
  #       현금 완충이 방어의 주원인이었다. 그 완충을 '버그의 부작용'으로 두지 않고
  #       의도한 정책으로 고정한다. 상승 전환 시 80% 대비 수익은 덜 먹는 대가다.
  #   (2) risk 블록 — 종전에는 전역 단타 기준(-3% 손절/+8% 익절/-5% 트레일링)이 진입
  #       시 기록되기만 하고 일일 사이클이 평가하지 않아, 손절선을 뚫은 포지션이 그대로
  #       방치됐다. 트랙 성격에 맞는 폭으로 다시 잡고 실제로 평가한다(core/basket_risk.py).
  kr_diversified_hold:
    name: "분산 대형주 buy&hold (저회전)"
    enabled: true
    primary: false
    purpose: "장기 관찰용"
    target_stock_weight: 0.60      # 주식 60% / 현금 40% — 낙폭 완충을 설계로 고정
    risk:
      # buy&hold 트랙의 손절은 '추세가 꺾였다'가 아니라 '한 종목이 포트폴리오를
      # 망가뜨리는 것'을 막는 장치다. 대형주 정상 조정(-10%대)에는 안 걸리고
      # 단일 종목 대형 손실만 잘라내도록 넓게 잡는다. 실측 참고: 이 구간 최악은
      # 현대차 -34.8%였고, 정상 조정권은 -10~-17%대에 몰려 있었다.
      stop_loss_pct: 0.25
      take_profit_pct: 0           # 익절 없음 — 장기 보유가 이 트랙의 전제
      trailing_stop_pct: 0         # 트레일링 없음 — 저회전 유지
      # 손절한 종목의 재매수를 막는 기간. 0이면 손절이 무의미해진다 — 비워진 슬롯을
      # 같은 사이클의 비중 교정이 곧바로 되사기 때문이다(2026-08-07 10:07에 실제로
      # 현대차를 손절 4초 뒤 되사는 왕복매매가 발생). 분기 리밸런싱 성격에 맞춰 60일.
      reentry_cooldown_days: 60
    # 관찰용 강등(docs/POCKET_TRACK_PLAN.md §6): 소액 전환으로 자본 증액 결정이 종결돼
    # 배치율 미달(-21%p, 하이닉스 슬롯+절사)은 조치 대상이 아니다 — 상시 ATTENTION은
    # 경보 피로만 남기고 다른 바스켓의 배치율 이탈을 가린다. 감시 사실상 해제(1.0).
    monitoring:
      deployment_tolerance: 1.0
    rebalance:
      trigger: drift               # 분기 점검을 권장하나 drift로 큰 이탈만 교정
      drift_threshold: 0.08        # 8%p 이상 이탈 시에만 리밸런싱(잦은 매매 억제)
      min_trade_amount: 200000
      max_turnover_ratio: 0.15     # 1회 회전 상한 15%(비용 최소화)
    # 섹터 분산 9종목 균등(각 1/9 ≈ 11.1%).
    # 000660(SK하이닉스) 제외 — 자본 규모상 이 트랙에서 보유가 불가능하다.
    # 1주 약 148만원인데 주식 슬리브(자본 1,000만 × 60% = 600만) 안에서 1주를 담으려면
    # 슬리브의 26%가 필요하고, 이는 단일 종목 상한(max_position_ratio 20%)을 넘는다.
    # 그래서 6/10 진입 이래 이 슬롯은 한 번도 못 채워졌고(매 사이클 '채움 불가' 경고),
    # 목표 비중표에 남겨 두면 영영 못 채우는 10% 공백이 배치율 미달로만 나타난다.
    # 자본을 약 2,500만원 이상으로 올리면 다시 편입 가능하다(그때는 비중 재산정).
    holdings:
      "005930": 0.1111  # 삼성전자 (반도체)
      "035420": 0.1111  # NAVER (인터넷)
      "005380": 0.1111  # 현대차 (자동차)
      "051910": 0.1111  # LG화학 (화학/배터리)
      "005490": 0.1111  # POSCO홀딩스 (철강)
      "055550": 0.1111  # 신한지주 (금융)
      "035720": 0.1111  # 카카오 (인터넷)
      "012330": 0.1111  # 현대모비스 (자동차부품)
      "105560": 0.1112  # KB금융 (금융)
      # 합계 = 1.00 (get_target_weights가 합 1.0으로 정규화하므로 절사 오차는 무해)
    holding_names:
      "005930": "삼성전자"
      "035420": "NAVER"
      "005380": "현대차"
      "051910": "LG화학"
      "005490": "POSCO홀딩스"
      "055550": "신한지주"
      "035720": "카카오"
      "012330": "현대모비스"
      "105560": "KB금융"

  # --- 균형 배분(주식 50% + 현금 50%) — 안정성 우선 ---
  # docs/STATIC_ALLOCATION.md 결론을 실행 기능으로 구현. target_stock_weight로 주식 비중을
  # 총자산의 50%로 고정하고 나머지는 현금 유보 → 낙폭을 순수 주식 대비 절반 수준으로 낮춘다
  # (백테스트 2022~25: 주식100% MDD -25.5% → 50:50 MDD -11.9%, CAGR 12.9%→9.1%, Sharpe 0.58→0.64).
  # 낙폭에 민감하거나 "안정적"을 우선하는 운영자용. enabled는 운영자가 검증 후 켠다.
  kr_balanced_5050:
    name: "한국 대형주 균형배분 (주식50/현금50)"
    enabled: false
    target_stock_weight: 0.5       # 총자산 중 주식 50%, 나머지 현금
    rebalance:
      trigger: drift
      drift_threshold: 0.08        # 저회전(큰 이탈만 교정)
      min_trade_amount: 200000
      max_turnover_ratio: 0.15
    holdings:                      # 주식 부분은 동일비중(섹터 분산 5종목)
      "005930": 0.20
      "000660": 0.20
      "035420": 0.20
      "005380": 0.20
      "051910": 0.20
      # 합계 = 1.00 (이 비중은 "주식 슬리브 내부" 기준; 주식 슬리브 자체가 총자산의 50%)

  # --- 소액 적립 트랙 (용돈 엔진) — docs/POCKET_TRACK_PLAN.md ---
  # 소액(30만 시작 + 월 10만 적립)의 유일한 분산 수단은 ETF다: KODEX 200 1주가
  # 그 자체로 200종목 분산이고, 국내 주식형 ETF는 매도 거래세 면제라 비용도 유리
  # (transaction_costs.tax_exempt_symbols에 등록 — 체결 모델도 면제 반영).
  #
  # v2 (2026-07-07): 위험자산 절반 원칙은 유지하되 "나머지 절반"을 무수익 현금 대신
  # CD금리 파킹 ETF로 보유한다. 종전 50/50에서 현금 50%는 이자 0으로 잠들어 있었는데,
  # 357870은 CD 91일물 금리 지수를 추종하는 무분배(TR형) ETF다. 수익률은 당시
  # CD금리에 따라 변하며 원금 보장 상품이 아니다. 합성 거래상대방·유동성 위험도 남는다.
  #   - 주가지수(069500) 47.5% + 파킹(357870) 47.5% + 현금 5%(수수료 여유)
  #   - min_cash_ratio 0.05: 전역 20% 하한은 개별 주식 바스켓용 안전판 — 보유분
  #     절반이 현금성인 이 바스켓엔 과잉이라 바스켓별 오버라이드로 낮춘다.
  #   - 한계 고지: KODEX200 분배금은 페이퍼가 못 받아 수익이 보수적으로 잡힌다.
  #     357870은 무분배지만 매매차익에 보유기간 과세가 적용되므로, 과표기준가가 없는
  #     현재 모델은 양의 매매차익 전액 × 15.4%를 세금 상한으로 차감한다.
  # 파라미터 주의(소액 특화):
  #   - max_turnover_ratio 0.6: 15%면 회전 한도(30만×15%=4.5만)가 ETF 1주가(약 12.4만)보다
  #     작아 영원히 매수 불가. 0.6이면 첫 사이클에 큰 슬롯부터 채운다(잔여는 다음 날).
  #   - min_trade_amount 50000: 기본 20만이면 슬롯(약 14만)이 최소거래 미달로 미체결 판정.
  # 월 적립은 웹 대시보드 입금 버튼 또는 tools/record_deposit.py --basket kr_pocket
  # --amount 100000 으로 기록(입금은 TWR이 중화 — 수익률 왜곡 없음). 다음 사이클이 흡수한다.
  kr_pocket:
    name: "소액 적립 (지수+CD금리 파킹)"
    enabled: true
    primary: true
    purpose: "월 적립 중심"
    contribution_plan:
      enabled: true
      cadence: "monthly"
      amount: 100000
    initial_capital: 300000        # 시작 자본 30만원 (paper — live 전환 시 실자본과 일치)
    target_stock_weight: 0.95      # 투자 95% (지수 47.5 + 파킹 47.5) / 현금 5%
    min_cash_ratio: 0.05           # 바스켓별 현금 하한 오버라이드 (전역 0.20 대체)
    # 소액 구조적 절사: ETF 1주(약 12.4만) 단위라 배치율 미달이 상시 존재하고, 적립
    # 직후에는 '부족분 < 1주'로 매수가 보류돼 미달이 벌어진다(docs/POCKET_TRACK_PLAN.md
    # §3 — 정상, 적립 누적 시 수렴). 이 값은 '하한(floor)'이고, 헬스가 구조 하한
    # (1주가/총액)과의 max로 자동 완화·조임한다 — 잔고가 커지면 이 값이 다시 지배한다.
    monitoring:
      deployment_tolerance: 0.10
    # 이 트랙의 리스크 정책은 '손절 없음'이며, 이는 누락이 아니라 결정이다.
    # 069500은 200종목 분산 지수 ETF고 이 트랙은 월 적립(DCA) 엔진이다. 지수에
    # 손절을 걸면 하락을 손실로 확정하면서 회복 구간을 통째로 놓치고, 적립식이
    # 하락에서 단가를 낮추는 효과까지 없앤다. 357870은 CD금리 파킹이라 손절 대상이
    # 아니다. 이 트랙의 실제 위험 통제는 위험자산을 절반(47.5%)으로 묶는 비중 자체다.
    # (전역 단타 -3% 손절이 진입 시 기록되던 것을 여기서 명시로 끈다.)
    risk:
      stop_loss_pct: 0
      take_profit_pct: 0
      trailing_stop_pct: 0
    rebalance:
      trigger: drift
      drift_threshold: 0.08
      min_trade_amount: 50000
      max_turnover_ratio: 0.6
    holdings:
      "069500": 0.5    # KODEX 200 — 위험자산 슬리브(총자산의 47.5%)
      "357870": 0.5    # TIGER CD금리투자KIS(합성) — 파킹 슬리브(총자산의 47.5%)
    holding_names:
      "069500": "KODEX 200"
      "357870": "TIGER CD금리투자KIS(합성)"

  # --- 예시 2: 신호 가중 리밸런싱 바스켓 ---
  # signal_weighted: true 시, 스코어링 전략 점수에 따라 목표 비중을 동적 조정
  kr_signal_weighted:
    name: "한국 대형주 신호가중"
    enabled: false
    signal_weighted: true          # 전략 신호로 비중 동적 조정
    signal_strategy: scoring       # 신호 소스 전략
    signal_weight_range: [0.5, 1.5]  # 기본 비중 × 0.5 ~ 1.5 범위로 조정
    rebalance:
      trigger: weekly
      weekday: 1                   # 월요일 (0=월, 4=금)
      drift_threshold: 0.03
      min_trade_amount: 50000
      max_turnover_ratio: 0.20
    holdings:
      "005930": 0.30
      "000660": 0.25
      "035420": 0.20
      "005380": 0.15
      "051910": 0.10
