# Research evidence only. These collectors cannot authorize or execute orders.
version: 1
request_timeout_seconds: 12
collection_budget_seconds: 120
workers: 3
disclosures:
  enabled: true
  lookback_calendar_days: 14
  max_pages_per_company: 4
  # Key comes only from DART_API_KEY / existing Config.dart, never this file.
